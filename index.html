<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE2">
<title>Meu Repertório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5EFE2; --card:#FFFCF6; --ink:#2A2823; --muted:#7A7363; --line:#E5DAC4;
    --green:#1F4D3A; --green-2:#2B6550; --green-soft:#E3ECE6;
    --amber:#C98A22; --amber-soft:#F7E6C4; --danger:#B03A2E;
    --radius:16px; --shadow:0 1px 2px rgba(60,45,20,.06),0 4px 14px rgba(60,45,20,.06);
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;min-height:100vh}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}

  /* Cabeçalho fixo */
  .top{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:calc(var(--safe-t) + 14px);padding-bottom:10px;border-bottom:1px solid transparent;transition:border-color .2s}
  .top.scrolled{border-bottom-color:var(--line)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .logo{width:42px;height:42px;border-radius:12px;background:var(--green);display:grid;place-items:center;flex:none}
  .logo svg{width:28px;height:28px}
  .brand > div:nth-child(2){flex:1;min-width:0}
  .hbtn{flex:none;width:46px;height:46px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center}
  .hbtn:active{background:#EBE2CF}
  .hbtn svg{width:22px;height:22px}
  .file-in{display:none}
  .bk-text{width:100%;min-height:110px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:13px;font-family:ui-monospace,monospace;resize:vertical}
  .hint{font-size:13.5px;color:var(--muted);margin:0 0 14px}
  .brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--green)}
  .brand p{margin:0;font-size:13px;color:var(--muted)}

  .tabs{display:grid;grid-template-columns:1fr 1fr;background:#EBE2CF;border-radius:14px;padding:4px;gap:4px}
  .tab{border:0;background:transparent;border-radius:11px;min-height:46px;font-weight:700;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
  .tab[aria-selected="true"]{background:var(--card);color:var(--green);box-shadow:var(--shadow)}
  .count{min-width:24px;height:22px;padding:0 7px;border-radius:11px;background:rgba(0,0,0,.06);font-size:12.5px;display:inline-grid;place-items:center}
  .tab[aria-selected="true"] .count{background:var(--amber-soft);color:#7A5210}

  .search{position:relative;margin-top:10px}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
  .search input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);padding:0 46px 0 44px;font-size:16px;outline:none}
  .search input:focus{border-color:var(--green-2)}
  .search input::placeholder{color:#A39B88}
  .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:transparent;border-radius:10px;color:var(--muted);font-size:22px;display:none}
  .search.has-text .clear{display:block}

  /* Modo de exibição */
  .viewbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .viewbar .lbl{font-size:13.5px;font-weight:700;color:var(--muted)}
  .vtoggle{display:flex;background:#EBE2CF;border-radius:12px;padding:3px;gap:3px}
  .vtoggle button{border:0;background:transparent;border-radius:9px;min-height:38px;padding:0 14px;font-weight:700;font-size:14px;color:var(--muted)}
  .vtoggle button[aria-pressed="true"]{background:var(--card);color:var(--green);box-shadow:var(--shadow)}

  /* Grupos por artista */
  .group{list-style:none}
  .group-head{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:12px 4px 8px;min-height:48px;text-align:left}
  .group-head .gname{flex:1;min-width:0;font-weight:800;font-size:16px;color:var(--green);overflow-wrap:anywhere}
  .group-head .gname.none{color:var(--muted);font-style:italic}
  .group-head .count{background:var(--amber-soft);color:#7A5210}
  .group-head .chev{width:20px;height:20px;color:var(--muted);transition:transform .15s;flex:none}
  .group.collapsed .chev{transform:rotate(-90deg)}
  .group.collapsed .sub{display:none}
  .sub{list-style:none;margin:0;padding:0 0 0 10px;border-left:3px solid var(--amber-soft);display:flex;flex-direction:column;gap:8px}
  .groups{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .group + .group{border-top:1px solid var(--line)}
  .gtools{display:flex;justify-content:flex-end;margin:2px 0 0}
  .gtools button{border:0;background:none;color:var(--green);font-weight:700;font-size:13.5px;padding:8px 4px;min-height:40px}

  /* Lista */
  main.wrap{padding-top:6px;padding-bottom:calc(100px + var(--safe-b))}
  .list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .card{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card-main{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:14px 4px 14px 16px;display:flex;flex-direction:column;gap:3px;min-height:68px;justify-content:center}
  .card-main:active{background:#FBF5E9}
  .title{font-weight:800;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
  .artist{color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
  .meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--amber-soft);color:#7A5210;display:inline-flex;align-items:center;gap:4px}
  .pill svg{width:12px;height:12px}
  .more{flex:none;width:52px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:0 var(--radius) var(--radius) 0}
  .more:active{background:#F3EBDB}
  .more svg{width:22px;height:22px}

  .empty{text-align:center;padding:42px 20px 20px;color:var(--muted)}
  .empty .ico{width:76px;height:76px;margin:0 auto 14px;border-radius:22px;background:var(--amber-soft);display:grid;place-items:center;color:var(--amber)}
  .empty .ico svg{width:44px;height:44px}
  .empty h2{margin:0 0 6px;font-size:19px;color:var(--ink)}
  .empty p{margin:0 auto;max-width:300px}
  .linkbtn{border:0;background:none;color:var(--green);font-weight:800;text-decoration:underline;padding:10px;font-size:15px}

  .status{margin:22px 8px 0;font-size:12.5px;color:var(--muted);text-align:center}
  .status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green-2);margin-right:6px;vertical-align:1px}
  .status.warn .dot{background:var(--danger)}
  .banner{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#F8E1DC;color:#7A251B;font-size:14px;display:none}
  .banner.show{display:block}

  /* Rodapé fixo */
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 16px calc(14px + var(--safe-b));background:linear-gradient(to top,var(--bg) 70%,rgba(245,239,226,0))}
  .bottombar .inner{max-width:528px;margin:0 auto}
  .primary{width:100%;min-height:56px;border:0;border-radius:16px;background:var(--green);color:#fff;font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(31,77,58,.28);display:flex;align-items:center;justify-content:center;gap:8px}
  .primary:active{background:var(--green-2)}
  .primary .plus{font-size:24px;line-height:1;margin-top:-2px}

  /* Folhas (modais) */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(30,25,15,.42);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
  .overlay.open{opacity:1;pointer-events:auto}
  .sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + var(--safe-b));transform:translateY(24px);transition:transform .2s}
  .overlay.open .sheet{transform:none}
  .grab{width:42px;height:5px;border-radius:3px;background:#D6CBB4;margin:2px auto 12px}
  .sheet h2{margin:0 0 14px;font-size:20px;color:var(--green)}
  .field{margin-bottom:14px}
  .field label,.field .lbl{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px}
  .field .opt{font-weight:600;color:var(--muted);font-size:13px}
  .field input,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
  .field input{height:50px}
  .field textarea{min-height:96px;resize:vertical}
  .field input:focus,.field textarea:focus{border-color:var(--green-2)}
  .field.invalid input{border-color:var(--danger)}
  .err{color:var(--danger);font-size:13.5px;margin-top:5px;display:none}
  .field.invalid .err{display:block}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label{margin:0;min-height:48px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted)}
  .seg input:checked + label{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .seg input:focus-visible + label{outline:2px solid var(--amber);outline-offset:2px}
  .actions{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:16px}
  .btn.green{background:var(--green);border-color:var(--green);color:#fff}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}

  .menu{display:flex;flex-direction:column;gap:8px}
  .menu-head{margin:0 2px 12px}
  .menu-head .title{font-size:18px}
  .mitem{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border:1px solid var(--line);background:var(--card);border-radius:14px;font-weight:700;font-size:16px;text-align:left}
  .mitem svg{width:22px;height:22px;color:var(--green);flex:none}
  .mitem.del{color:var(--danger)} .mitem.del svg{color:var(--danger)}
  .mitem.cancel{justify-content:center;background:transparent;margin-top:4px}

  .detail .title{font-size:22px}
  .detail .artist{font-size:16px;margin-top:2px}
  .chip{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--green-soft);color:var(--green)}
  .chip.q{background:var(--amber-soft);color:#7A5210}
  .block{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .block .lbl{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .notes{white-space:pre-wrap;overflow-wrap:anywhere}
  .open-link{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:12px;background:var(--amber);color:#fff;font-weight:800;text-decoration:none}
  .open-link svg{width:18px;height:18px}
  .url{font-size:13px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
  .detail .actions{margin-top:18px;flex-wrap:wrap}
  .detail .actions .btn{flex:1 1 30%;font-size:15px}

  .confirm p{margin:0 0 18px;color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,16px);z-index:60;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14.5px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:all .2s;box-shadow:0 6px 18px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-guitar" viewBox="0 0 32 32">
      <g transform="translate(16 16) scale(1.12) rotate(-38) translate(-16 -16)">
        <rect x="14.6" y="1.5" width="2.8" height="4.5" rx="1" fill="currentColor"/>
        <rect x="15.1" y="5" width="1.8" height="11" fill="currentColor"/>
        <ellipse cx="16" cy="17.2" rx="5.2" ry="4.6" fill="currentColor"/>
        <ellipse cx="16" cy="24" rx="7" ry="6.2" fill="currentColor"/>
        <circle cx="16" cy="20.6" r="2.1" fill="var(--hole,#1F4D3A)"/>
        <rect x="13.2" y="25.6" width="5.6" height="1.3" rx=".6" fill="var(--hole,#1F4D3A)"/>
      </g>
    </symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M4 8h13l-4-4M20 16H7l4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-backup" viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<header class="top" id="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg style="color:#F5EFE2;--hole:#1F4D3A"><use href="#i-guitar"/></svg></div>
      <div>
        <h1>Meu Repertório</h1>
        <p id="subtitle">Suas músicas no violão</p>
      </div>
      <button class="hbtn" id="backupBtn" aria-label="Backup das músicas"><svg><use href="#i-backup"/></svg></button>
    </div>
    <div class="tabs" role="tablist" aria-label="Listas">
      <button class="tab" role="tab" id="tab-sei" data-list="sei" aria-selected="true">Sei tocar <span class="count" id="count-sei">0</span></button>
      <button class="tab" role="tab" id="tab-quero" data-list="quero" aria-selected="false">Quero aprender <span class="count" id="count-quero">0</span></button>
    </div>
    <div class="search" id="searchBox">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <label for="q" class="sr">Buscar música ou artista</label>
      <input id="q" type="search" placeholder="Buscar música ou artista" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clearQ" aria-label="Limpar busca">×</button>
    </div>
    <div class="viewbar">
      <span class="lbl" id="viewLbl">Exibir</span>
      <div class="vtoggle" role="group" aria-labelledby="viewLbl">
        <button data-view="lista" aria-pressed="true">Lista</button>
        <button data-view="artista" aria-pressed="false">Por artista</button>
      </div>
    </div>
    <div class="banner" id="banner"></div>
  </div>
</header>

<main class="wrap">
  <ul class="list" id="list" aria-live="polite"></ul>
  <div id="emptyBox"></div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Carregando…</span></div>
</main>

<div class="bottombar">
  <div class="inner">
    <button class="primary" id="addBtn"><span class="plus">+</span> Adicionar música</button>
  </div>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  "use strict";
  var LS_KEY = "meu-repertorio:musicas:v1";
  var LS_TAB = "meu-repertorio:aba";
  var LABEL = { sei: "Sei tocar", quero: "Quero aprender" };

  var LS_VIEW = "meu-repertorio:exibicao";
  var LS_COLL = "meu-repertorio:recolhidos";
  var state = { songs: [], tab: "sei", query: "", loaded: false, view: "lista", collapsed: {} };
  var store = null;

  /* ---------- utilidades ---------- */
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function norm(s){ return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim(); }
  function uid(){ try { if (crypto.randomUUID) return crypto.randomUUID(); } catch(e){} return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function other(list){ return list === "sei" ? "quero" : "sei"; }
  function fixUrl(u){
    u = String(u || "").trim();
    if (!u) return "";
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = "https://" + u;
    return u;
  }
  function safeHref(u){ return /^https?:\/\//i.test(u) ? u : ""; }
  function byTitle(a, b){
    return a.title.localeCompare(b.title, "pt-BR", { sensitivity: "base" }) || (a.artist || "").localeCompare(b.artist || "", "pt-BR", { sensitivity: "base" });
  }
  function clean(raw){
    if (!raw || typeof raw !== "object") return null;
    var t = String(raw.title || "").trim();
    if (!t) return null;
    return {
      id: String(raw.id),
      title: t.slice(0, 200),
      artist: String(raw.artist || "").trim().slice(0, 200),
      list: raw.list === "quero" ? "quero" : "sei",
      link: String(raw.link || "").trim().slice(0, 2000),
      notes: String(raw.notes || "").slice(0, 5000),
      createdAt: Number(raw.createdAt) || 0,
      updatedAt: Number(raw.updatedAt) || 0
    };
  }
  function withTimeout(p, ms){
    return Promise.race([p, new Promise(function(res){ setTimeout(function(){ res(null); }, ms); })]);
  }

  /* ---------- armazenamento ---------- */
  // 1) banco persistente do Artifact (privado por pessoa, sincroniza entre dispositivos)
  // 2) localStorage (só neste navegador)
  // 3) memória (não salva — mostra aviso)
  function makeDbStore(col){
    var chains = {};
    function queue(id, fn){
      var prev = chains[id] || Promise.resolve();
      var next = prev.catch(function(){}).then(fn);
      chains[id] = next;
      return next;
    }
    return {
      kind: "db",
      subscribe: function(cb, onErr){
        return col.onSnapshot(function(snap){
          cb(snap.docs.map(function(d){ var o = Object.assign({}, d.data()); o.id = d.id; return o; }), snap.metadata);
        }, onErr);
      },
      save: function(song){
        var body = Object.assign({}, song); delete body.id;
        return queue(song.id, function(){ return col.doc(song.id).set(body); });
      },
      remove: function(id){ return queue(id, function(){ return col.doc(id).delete(); }); }
    };
  }

  function lsAvailable(){
    try {
      var k = "__mr_test__"; localStorage.setItem(k, "1");
      var ok = localStorage.getItem(k) === "1"; localStorage.removeItem(k); return ok;
    } catch(e){ return false; }
  }
  function makeLocalStore(persist){
    var data = [];
    if (persist) { try { data = JSON.parse(localStorage.getItem(LS_KEY) || "[]") || []; } catch(e){ data = []; } }
    var listener = null;
    function emit(){ if (listener) listener(data.slice(), { fromCache: false }); }
    function write(){
      if (!persist) return Promise.resolve();
      try { localStorage.setItem(LS_KEY, JSON.stringify(data)); return Promise.resolve(); }
      catch(e){ return Promise.reject({ code: "local", message: "Não foi possível salvar neste navegador." }); }
    }
    window.addEventListener("storage", function(e){
      if (persist && e.key === LS_KEY) { try { data = JSON.parse(e.newValue || "[]") || []; } catch(err){} emit(); }
    });
    return {
      kind: persist ? "local" : "memory",
      subscribe: function(cb){ listener = cb; setTimeout(emit, 0); return function(){ listener = null; }; },
      save: function(song){
        var i = data.findIndex(function(s){ return s.id === song.id; });
        if (i >= 0) data[i] = song; else data.push(song);
        emit(); return write();
      },
      remove: function(id){ data = data.filter(function(s){ return s.id !== id; }); emit(); return write(); }
    };
  }

  async function connectDb(){
    if (!window.claude || typeof window.claude.use !== "function") return null;
    try {
      var r = await withTimeout(Promise.all([window.claude.use("db"), window.claude.use("user")]), 11000);
      if (!r || !r[0] || !r[1]) return null;
      var db = r[0], user = r[1];
      var id = await withTimeout(user.id(), 8000);
      if (!id) return null;
      return makeDbStore(db.doc("data/users/" + id + "/repertorio").collection("musicas"));
    } catch(e){ return null; }
  }

  function setStatus(kind){
    var el = $("status"), txt = $("statusText");
    el.classList.toggle("warn", kind === "memory" || kind === "offline");
    txt.textContent = ({
      db: "Salvo automaticamente na sua conta Claude. Abra este app logado em qualquer dispositivo para ver suas músicas.",
      local: "Salvo automaticamente neste aparelho. Funciona sem internet; use o backup para guardar uma cópia.",
      memory: "Atenção: este ambiente não permite salvar. As músicas somem ao fechar.",
      offline: "Não foi possível conectar ao armazenamento ainda. Tentando…",
      loading: "Carregando seu repertório…"
    })[kind] || "";
  }
  function showBanner(msg){ var b = $("banner"); b.textContent = msg || ""; b.classList.toggle("show", !!msg); }

  function startStore(s){
    store = s;
    setStatus(s.kind === "db" ? "loading" : s.kind);
    if (s.kind === "memory") showBanner("Este navegador não permite salvar. Use a versão HTML do app ou abra o link do Artifact logado no Claude.");
    var timer = null;
    if (s.kind === "db") timer = setTimeout(function(){ setStatus("offline"); }, 10000);
    s.subscribe(function(rows, meta){
      state.songs = rows.map(clean).filter(Boolean);
      state.loaded = true;
      if (s.kind === "db" && meta && !meta.fromCache) { clearTimeout(timer); setStatus("db"); }
      render();
    }, function(err){
      clearTimeout(timer);
      state.loaded = true;
      setStatus("offline");
      $("statusText").textContent = "A conexão com o armazenamento foi interrompida. Recarregue a página para tentar de novo.";
      render();
    });
  }

  async function init(){
    try { var t = localStorage.getItem(LS_TAB); if (t === "sei" || t === "quero") state.tab = t; } catch(e){}
    try { var v = localStorage.getItem(LS_VIEW); if (v === "lista" || v === "artista") state.view = v; } catch(e){}
    try { state.collapsed = JSON.parse(localStorage.getItem(LS_COLL) || "{}") || {}; } catch(e){ state.collapsed = {}; }
    setStatus("loading");
    render();
    var s = await connectDb();
    if (!s) s = makeLocalStore(lsAvailable());
    startStore(s);
  }

  function persist(song){
    song.updatedAt = Date.now();
    // otimista: mostra já na tela
    var i = state.songs.findIndex(function(x){ return x.id === song.id; });
    if (i >= 0) state.songs[i] = song; else state.songs.push(song);
    render();
    return Promise.resolve(store.save(song)).catch(function(e){
      toast("Não foi possível salvar. Tente de novo.");
      throw e;
    });
  }
  function destroy(id){
    state.songs = state.songs.filter(function(x){ return x.id !== id; });
    render();
    return Promise.resolve(store.remove(id)).catch(function(){ toast("Não foi possível excluir. Tente de novo."); });
  }

  /* ---------- tela principal ---------- */
  function filtered(list){
    var q = norm(state.query);
    return state.songs.filter(function(s){
      if (s.list !== list) return false;
      if (!q) return true;
      return norm(s.title + " " + s.artist).indexOf(q) >= 0;
    }).sort(byTitle);
  }

  function render(){
    var sei = state.songs.filter(function(s){ return s.list === "sei"; }).length;
    var quero = state.songs.length - sei;
    $("count-sei").textContent = sei;
    $("count-quero").textContent = quero;
    $("subtitle").textContent = state.songs.length
      ? sei + (sei === 1 ? " música que sei" : " músicas que sei") + " · " + quero + " para aprender"

    ["sei","quero"].forEach(function(l){ $("tab-" + l).setAttribute("aria-selected", String(state.tab === l)); });
    $("searchBox").classList.toggle("has-text", !!state.query);

    document.querySelectorAll(".vtoggle button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.view === state.view)); });

    var items = filtered(state.tab);
    var ul = $("list");
    function card(s, showArtist){
      var meta = "";
      if (s.link) meta += '<span class="pill"><svg><use href="#i-link"/></svg>Link</span>';
      if (s.notes.trim()) meta += '<span class="pill"><svg><use href="#i-note"/></svg>Anotações</span>';
      return '<li class="card" data-id="' + esc(s.id) + '">' +
        '<button class="card-main" data-act="open" aria-label="Ver detalhes de ' + esc(s.title) + '">' +
          '<span class="title">' + esc(s.title) + '</span>' +
          (showArtist && s.artist ? '<span class="artist">' + esc(s.artist) + '</span>' : '') +
          (meta ? '<span class="meta">' + meta + '</span>' : '') +
        '</button>' +
        '<button class="more" data-act="menu" aria-label="Mais opções para ' + esc(s.title) + '"><svg><use href="#i-dots"/></svg></button>' +
      '</li>';
    }

    if (state.view === "artista" && items.length) {
      var groups = groupByArtist(items);
      var searching = !!norm(state.query);
      var allCollapsed = groups.every(function(g){ return isCollapsed(g.key); });
      ul.className = "groups";
      ul.innerHTML = (groups.length > 1 && !searching
          ? '<li class="gtools"><button data-act="toggle-all">' + (allCollapsed ? "Expandir todos" : "Recolher todos") + '</button></li>' : '') +
        groups.map(function(g){
          var closed = !searching && isCollapsed(g.key);
          return '<li class="group' + (closed ? " collapsed" : "") + '">' +
            '<button class="group-head" data-act="toggle-group" data-key="' + esc(g.key) + '" aria-expanded="' + (!closed) + '">' +
              '<span class="gname' + (g.key ? '' : ' none') + '">' + esc(g.name) + '</span>' +
              '<span class="count">' + g.songs.length + '</span>' +
              '<svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg>' +
            '</button>' +
            '<ul class="sub">' + g.songs.map(function(s){ return card(s, false); }).join("") + '</ul>' +
          '</li>';
        }).join("");
    } else {
      ul.className = "list";
      ul.innerHTML = items.map(function(s){ return card(s, true); }).join("");
    }

    var eb = $("emptyBox");
    if (items.length) { eb.innerHTML = ""; return; }
    if (!state.loaded) { eb.innerHTML = '<div class="empty"><p>Carregando…</p></div>'; return; }
    if (state.query) {
      var elsewhere = filtered(other(state.tab)).length;
      eb.innerHTML = '<div class="empty"><h2>Nada encontrado</h2><p>Nenhuma música ou artista com “' + esc(state.query.trim()) + '” em ' + LABEL[state.tab] + '.</p>' +
        (elsewhere ? '<button class="linkbtn" data-act="switch">Ver ' + elsewhere + ' em “' + LABEL[other(state.tab)] + '”</button>' : '') + '</div>';
      return;
    }
    var msg = state.tab === "sei"
      ? ["Seu repertório começa aqui", "Cadastre a primeira música que você já sabe tocar no violão."]
      : ["Nenhuma música na fila", "Anote aqui as músicas que você quer aprender a tocar."];
    eb.innerHTML = '<div class="empty"><div class="ico"><svg style="--hole:#F7E6C4"><use href="#i-guitar"/></svg></div><h2>' + msg[0] + '</h2><p>' + msg[1] + '</p>' +
      '<button class="linkbtn" data-act="add">+ Adicionar música</button></div>';
  }

  /* ---------- agrupamento por artista ---------- */
  // Agrupa ignorando maiúsculas, acentos e espaços extras ("Legião Urbana" = "legiao urbana").
  function artistKey(a){ return norm(a); }
  function displayNames(){
    var tally = {};
    state.songs.forEach(function(s){
      var k = artistKey(s.artist); if (!k) return;
      tally[k] = tally[k] || {};
      tally[k][s.artist] = (tally[k][s.artist] || 0) + 1;
    });
    var out = {};
    Object.keys(tally).forEach(function(k){
      out[k] = Object.keys(tally[k]).sort(function(a, b){ return tally[k][b] - tally[k][a] || a.localeCompare(b, "pt-BR"); })[0];
    });
    return out;
  }
  function groupByArtist(items){
    var names = displayNames(), map = {};
    items.forEach(function(s){
      var k = artistKey(s.artist);
      (map[k] = map[k] || { key: k, name: k ? names[k] : "Sem artista", songs: [] }).songs.push(s);
    });
    return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a, b){
      if (!a.key) return 1; if (!b.key) return -1;
      return a.name.localeCompare(b.name, "pt-BR", { sensitivity: "base" });
    });
  }
  function collKey(k){ return state.tab + ":" + (k || "-"); }
  function isCollapsed(k){ return !!state.collapsed[collKey(k)]; }
  function saveCollapsed(){ try { localStorage.setItem(LS_COLL, JSON.stringify(state.collapsed)); } catch(e){} }
  function toggleGroup(k){
    var c = collKey(k);
    if (state.collapsed[c]) delete state.collapsed[c]; else state.collapsed[c] = 1;
    saveCollapsed(); render();
  }
  function toggleAll(){
    var groups = groupByArtist(filtered(state.tab));
    var collapse = !groups.every(function(g){ return isCollapsed(g.key); });
    groups.forEach(function(g){ var c = collKey(g.key); if (collapse) state.collapsed[c] = 1; else delete state.collapsed[c]; });
    saveCollapsed(); render();
  }
  function setView(v){
    state.view = v;
    try { localStorage.setItem(LS_VIEW, v); } catch(e){}
    render();
  }

  function setTab(t){
    state.tab = t;
    try { localStorage.setItem(LS_TAB, t); } catch(e){}
    render();
  }

  /* ---------- backup (exportar / importar) ---------- */
  var inArtifact = !!(window.claude && typeof window.claude.use === "function");
  var bridge = window.AndroidApp || null; // presente só no app Android, se existir
  function backupJson(){
    return JSON.stringify({
      app: "meu-repertorio", formato: 1, exportadoEm: new Date().toISOString(),
      musicas: state.songs.slice().sort(byTitle)
    }, null, 2);
  }
  function backupName(){ return "meu-repertorio-" + new Date().toISOString().slice(0, 10) + ".json"; }
  function copyText(text){
    if (bridge && bridge.copy) { try { bridge.copy(text); return Promise.resolve(); } catch(e){} }
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return Promise.reject();
  }
  function openBackup(){
    var n = state.songs.length;
    var canDownload = !inArtifact;
    openSheet(
      '<h2>Backup das músicas</h2>' +

      '<div class="menu">' +
        (bridge && bridge.share ? '<button class="mitem" data-act="bk-share"><svg><use href="#i-backup"/></svg>Salvar ou enviar backup (' + n + ')</button>' : '') +
        (canDownload && !bridge ? '<button class="mitem" data-act="bk-download"><svg><use href="#i-backup"/></svg>Baixar arquivo de backup (' + n + ')</button>' : '') +
        '<button class="mitem" data-act="bk-copy"><svg><use href="#i-note"/></svg>Copiar backup (' + n + ' músicas)</button>' +
        '<button class="mitem" data-act="bk-import"><svg><use href="#i-move"/></svg>Importar backup</button>' +
        '<button class="mitem cancel" data-act="close">Fechar</button>' +

  function exportCopy(){
    copyText(backupJson()).then(function(){ closeSheet(); toast("Backup copiado. Cole onde quiser guardar."); }, function(){
      openSheet('<h2>Copiar backup</h2><p class="hint">Selecione todo o texto abaixo e copie.</p><textarea class="bk-text" readonly>' + esc(backupJson()) + '</textarea>' +
        '<div class="actions"><button class="btn green" data-act="close">Fechar</button></div>', null);
    });
  }
  function exportDownload(){
    try {
      var blob = new Blob([backupJson()], { type: "application/json" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = backupName();
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      closeSheet(); toast("Backup salvo nos downloads");
    } catch(e){ exportCopy(); }
  }
  function exportShare(){
    try { bridge.share(backupJson(), backupName()); closeSheet(); } catch(e){ exportCopy(); }
  }
  function openImport(){
    openSheet(
      '<h2>Importar backup</h2>' +
      '<p class="hint">Escolha o arquivo de backup ou cole o texto copiado. Músicas que já existem não são duplicadas.</p>' +
      '<input type="file" id="bk-file" class="file-in" accept=".json,application/json,text/plain">' +
      '<div class="menu"><button class="mitem" data-act="bk-pick"><svg><use href="#i-backup"/></svg>Escolher arquivo</button></div>' +
      '<div class="field" style="margin-top:14px"><label for="bk-paste">Ou cole o backup aqui</label><textarea id="bk-paste" class="bk-text" placeholder="{ &quot;app&quot;: &quot;meu-repertorio&quot;, … }"></textarea></div>' +
      '<div class="actions"><button class="btn" data-act="close">Cancelar</button><button class="btn green" data-act="bk-do-import">Importar</button></div>', null);
    $("bk-file").addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function(){ importText(String(r.result || "")); };
      r.onerror = function(){ toast("Não foi possível ler o arquivo."); };
      r.readAsText(f);
    });
  }
  function importText(text){
    var data;
    try { data = JSON.parse(text); } catch(e){ toast("Esse texto não é um backup válido."); return; }
    var rows = Array.isArray(data) ? data : (data && Array.isArray(data.musicas) ? data.musicas : null);
    if (!rows) { toast("Esse texto não é um backup do Meu Repertório."); return; }
    var added = 0, updated = 0, jobs = [];
    rows.forEach(function(raw){
      if (!raw || typeof raw !== "object") return;
      var s = clean(Object.assign({}, raw, { id: raw.id || uid() }));
      if (!s) return;
      if (!/^[A-Za-z0-9_.~:@+-]{1,150}$/.test(s.id)) s.id = uid();
      var cur = find(s.id);
      if (!cur) { added++; }
      else if ((s.updatedAt || 0) > (cur.updatedAt || 0)) { updated++; }
      else return;
      if (!s.createdAt) s.createdAt = Date.now();
      jobs.push(s);
    });
    closeSheet();
    if (!jobs.length) { toast("Nada novo para importar."); return; }
    jobs.forEach(function(s){
      var keep = s.updatedAt;
      var i = state.songs.findIndex(function(x){ return x.id === s.id; });
      if (i >= 0) state.songs[i] = s; else state.songs.push(s);
      Promise.resolve(store.save(s)).catch(function(){ toast("Algumas músicas não foram salvas. Tente de novo."); });
      s.updatedAt = keep;
    });
    render();
    toast(added + (added === 1 ? " música importada" : " músicas importadas") + (updated ? ", " + updated + " atualizadas" : ""));
  }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  /* ---------- eventos ---------- */
  document.querySelectorAll(".tab").forEach(function(b){ b.addEventListener("click", function(){ setTab(b.dataset.list); }); });
  document.querySelectorAll(".vtoggle button").forEach(function(b){ b.addEventListener("click", function(){ setView(b.dataset.view); }); });
  $("q").addEventListener("input", function(e){ state.query = e.target.value; render(); });
  $("clearQ").addEventListener("click", function(){ state.query = ""; $("q").value = ""; render(); $("q").focus(); });
  $("addBtn").addEventListener("click", function(){ openForm(null); });
  $("backupBtn").addEventListener("click", openBackup);

  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if (!b) return;
    var act = b.dataset.act;
    var holder = b.closest("[data-id]");
    var id = holder ? holder.dataset.id : null;
    if (act === "add") return openForm(null);
    if (act === "toggle-group") return toggleGroup(b.dataset.key);
    if (act === "toggle-all") return toggleAll();
    if (act === "bk-copy") return exportCopy();
    if (act === "bk-download") return exportDownload();
    if (act === "bk-share") return exportShare();
    if (act === "bk-import") { closeSheet(); return setTimeout(openImport, 200); }
    if (act === "bk-pick") return $("bk-file").click();
    if (act === "bk-do-import") { var t = $("bk-paste").value.trim(); if (!t) { toast("Cole o backup ou escolha um arquivo."); return; } return importText(t); }
    if (act === "switch") return setTab(other(state.tab));
    if (act === "close") return closeSheet();
    if (act === "open") return openDetail(id);
    if (act === "menu") return openMenu(id);
    if (act === "edit") { var s = find(id); closeSheet(); return setTimeout(function(){ openForm(s); }, 200); }
    if (act === "move") return moveSong(id);
    if (act === "delete") { closeSheet(); return setTimeout(function(){ confirmDelete(id); }, 200); }
    if (act === "confirm-delete") {
      var d = find(id); closeSheet(); destroy(id);
      if (d) toast("“" + d.title + "” excluída");
    }
  });
  $("overlay").addEventListener("click", function(e){ if (e.target === $("overlay")) closeSheet(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && $("overlay").classList.contains("open")) closeSheet(); });
  window.addEventListener("scroll", function(){ $("top").classList.toggle("scrolled", window.scrollY > 4); }, { passive: true });

  init();
})();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", function(){
    try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch(e){}
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  });
}
</script>
